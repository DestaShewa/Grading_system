{% extends "base.html" %}

{% block title %}Add Student | GradePro{% endblock %}

{% block content %}

<div class="page-header">

    <div>
        <h2>Add Student</h2>

        <p>
            Create a new student record.
        </p>
    </div>

    <a
        href="{{ url_for('students.student_list') }}"
        class="button button-secondary">
        ← Back
    </a>

</div>


<div class="form-card">

    <form method="POST">

        <div class="form-group">

            <label for="student_id">
                Student ID
            </label>

            <input
                type="text"
                id="student_id"
                name="student_id"
                placeholder="e.g. STU-001"
                required>

        </div>


        <div class="form-group">

            <label for="name">
                Full Name
            </label>

            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter student's full name"
                required>

        </div>


        <div class="form-row">

            <div class="form-group">

                <label for="math">
                    Mathematics
                </label>

                <input
                    type="number"
                    id="math"
                    name="math"
                    min="0"
                    max="100"
                    step="0.01"
                    placeholder="0 - 100"
                    required>

            </div>


            <div class="form-group">

                <label for="english">
                    English
                </label>

                <input
                    type="number"
                    id="english"
                    name="english"
                    min="0"
                    max="100"
                    step="0.01"
                    placeholder="0 - 100"
                    required>

            </div>


            <div class="form-group">

                <label for="science">
                    Science
                </label>

                <input
                    type="number"
                    id="science"
                    name="science"
                    min="0"
                    max="100"
                    step="0.01"
                    placeholder="0 - 100"
                    required>

            </div>

        </div>


        <div class="form-actions">

            <a
                href="{{ url_for('students.student_list') }}"
                class="button button-secondary">
                Cancel
            </a>

            <button type="submit">
                Save Student
            </button>

        </div>

    </form>

</div>

{% endblock %}
