{% extends "base.html" %}

{% block title %}
Add Student
{% endblock %}

{% block content %}

<h2>Add Student</h2>

<form method="POST">

    <div>
        <label>Student ID</label>
        <input
            type="text"
            name="student_id"
            required
        >
    </div>

    <div>
        <label>Student Name</label>
        <input
            type="text"
            name="name"
            required
        >
    </div>

    <div>
        <label>Math</label>
        <input
            type="number"
            name="math"
            min="0"
            max="100"
            required
        >
    </div>

    <div>
        <label>English</label>
        <input
            type="number"
            name="english"
            min="0"
            max="100"
            required
        >
    </div>

    <div>
        <label>Science</label>
        <input
            type="number"
            name="science"
            min="0"
            max="100"
            required
        >
    </div>

    <button type="submit">
        Save Student
    </button>

</form>

{% endblock %}
